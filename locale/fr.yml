      title_size_label: Taille du titre
      subtitle_size_label: Taille du message
      size_s: Petite
      size_m: Moyenne (taille de Flarum)
      size_l: Grande
      size_xl: Très grande
      auto_color_label: Couleur automatique (celle de Flarum)
      color_label: Couleur du texte
      color_help: Une couleur claire sur une image ou un filtre sombre garde le texte lisible.
    dismissible:
      title: Bouton fermer
      label: Afficher le bouton fermer (✕)
