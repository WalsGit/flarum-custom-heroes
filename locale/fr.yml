      section_not_allowed: "{path} : cette section n'est pas autorisée ici."
      stops_order: "{path} : les points de couleur doivent être dans l'ordre croissant."
      too_long: "{path} : {max} caractères maximum."
      too_many_items: "{path} : {max} éléments maximum."
      unknown_key: "{path} : clé inconnue."

