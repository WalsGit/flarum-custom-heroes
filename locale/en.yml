walsgit-custom-heroes:
  # For more details on the format
  # Checkout https://docs.flarum.org/2.x/extend/i18n/#appendix-a-standard-key-format
  admin:
    scope_label: Hero to customize
    scope_help: "Settings of Default apply to the home hero and to every hero. Tags and Discussions inherit them, then each tag inherits from Tags."
    scopes:
      global: Default (home and all heroes)
      tag: Tags (default)
      tag_instance: "Tag: {name}"
      discussion: Discussions
      customized: "{label} — customized"
    inherit_from_label: "Inherit from \"{source}\""
    inherit_core_label: "Use Flarum's default"
    save_button: Save
    cancel_button: Cancel changes
    reset_button: Inherit everything
    reset_global_button: "Back to Flarum's default"
    reset_confirm: "Remove all the settings of \"{target}\"? Its images will be deleted."
    discard_confirm: Discard your unsaved changes?
    saved_message: The hero settings have been saved.
    webp_unsupported: "This server cannot encode WebP images (GD or Imagick without WebP support): image uploads will fail."
    preview:
      title: Preview
      desktop: Desktop
      tablet: Tablet
      mobile: Mobile
      tag_title: Tag name
      tag_subtitle: The description of the tag.
      state_welcome: Welcome banner
      state_closed: Once closed
      hidden: "Once the welcome banner is closed, this hero is hidden (Flarum's behavior)."
      discussion_title: The title of a discussion
    background:
      title: Background image
      no_image: No image
      small_image_warning: "This image is only {width} px wide: it may look blurry on large screens ({recommended} px or more recommended). It is still used."
      position_label: Position
      position_center: Center
      position_top: Top
      position_bottom: Bottom
    image:
      upload_button: Upload an image
      remove_button: No image
      upload_help: "JPEG, PNG or WebP, up to {size} MB and 4000 px per side. Optimized to WebP."
      too_large: "This image is too large: {size} MB maximum."
      url_label: Or import from a URL
      url_help: The image is downloaded once and stored on your forum.
      import_button: Import
    overlay:
      title: Overlay
      type_label: Type
      type_none: None
      type_solid: Solid color
      type_gradient: Linear gradient
      type_radial: Radial gradient
      type_corners: 4 corners gradient
      corner_topLeft: Top left
      corner_topRight: Top right
      corner_bottomLeft: Bottom left
      corner_bottomRight: Bottom right
      corners_help: Each color starts from its corner and blends with the others in the middle. Lower the opacity to see the image through.
      direction_label: Direction
      direction_angle: Along an angle
      from_top_left: From the top left corner
      from_top_right: From the top right corner
      from_bottom_left: From the bottom left corner
      from_bottom_right: From the bottom right corner
      corner_help: The gradient goes diagonally to the opposite corner, whatever the size of the hero.
      shape_label: Shape
      shape_ellipse: Ellipse (follows the hero's proportions)
      shape_circle: Circle
      center_label: Center
      center_center: Middle
      center_top_left: Top left corner
      center_top_right: Top right corner
      center_bottom_left: Bottom left corner
      center_bottom_right: Bottom right corner
      color_label: Color
      opacity_label: "{label}: opacity"
      angle_label: Angle
      angle_help: "0° goes from bottom to top, 90° from left to right, 180° from top to bottom."
      stops_label: Colors
      stop_label: "Color {number}"
      stop_position_label: "Color {number}: position"
      stops_help: "Each color has a position along the gradient, from 0 to 100% (for a radial gradient: from the center outwards)."
      add_stop_button: Add a color
      remove_stop_button: Remove this color
    height:
      title: Height
      preset_label: Height
      preset_auto: "Flarum's default (follows the text)"
      preset_s: "Small ({desktop} / {tablet} / {mobile} px)"
      preset_m: "Medium ({desktop} / {tablet} / {mobile} px)"
      preset_l: "Large ({desktop} / {tablet} / {mobile} px)"
      preset_custom: Custom
      preset_help: "Fixed heights on desktop / tablet / mobile: the hero keeps its height whatever the text (title cut after 2 lines, message after 3)."
      desktop_label: Desktop
      tablet_label: Tablet
      mobile_label: Mobile
    logo:
      title: Logo
      no_logo: No logo
      image_help: "JPEG, PNG or WebP. Transparency is kept. Stored at most 256 px high (twice the largest size, for sharp screens)."
      side_label: Side
      side_left: Left of the text
      side_right: Right of the text
      side_help: The logo and the text are placed together, following the text alignment.
      size_label: Size
      size_s: "Small ({height} px high)"
      size_m: "Medium ({height} px high)"
      size_l: "Large ({height} px high)"
      alt_label: Alternative text
      alt_help: "Read by screen readers, for example your forum's name. Leave empty if the logo is only decorative."
      hide_on_mobile_label: Hide on mobile
    text:
      title: Text
      intro: "Flarum's welcome banner (Basics) is shown first and can be closed with ✕, like in Flarum. This sets what the hero does once it is closed, or when the welcome banner has no title."
      after_close_label: Once the welcome banner is closed
      after_close_hero: Keep the hero, with the text below
      after_close_none: "Hide the hero (Flarum's behavior)"
      title_label: Title
      message_label: Message
      message_help: Plain text, line breaks are kept. Leave both empty for a hero without text (background only).
    text_style:
      title: Text style
      align_label: Horizontal alignment
      align_left: Left
      align_center: Center
      align_right: Right
      v_align_label: Vertical position
      v_align_top: Top
      v_align_middle: Middle
      v_align_bottom: Bottom
      v_align_help: Only visible when the hero is taller than its text (see Height).
      title_size_label: Title size
      subtitle_size_label: Message size
      size_s: Small
      size_m: "Medium (Flarum's size)"
      size_l: Large
      size_xl: Extra large
      auto_color_label: "Automatic color (Flarum's)"
      color_label: Text color
      color_help: A light color on a dark image or overlay keeps the text readable.

  api:
    validation:
      image_processing_failed: "{path}: the image could not be processed. The server may not support WebP."
      image_download_failed: "{path}: the image could not be downloaded (unreachable or non-public address, or file larger than 5 MB)."
      image_not_found: "{path}: the image was not found, upload it again."
      invalid_value: "{path}: invalid value."
      missing_key: "{path}: this value is required."
      not_enough_items: "{path}: at least {min} items are required."
      placement_conflict: "{path}: buttons and social icons cannot share the same corner."
      section_not_allowed: "{path}: this section is not allowed here."
      stops_order: "{path}: color stops must be in ascending order."
      too_long: "{path}: must be at most {max} characters."
      too_many_items: "{path}: at most {max} items are allowed."
      unknown_key: "{path}: unknown key."

  forum:
